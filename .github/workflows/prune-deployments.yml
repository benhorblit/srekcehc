# Deletes Cloudflare Pages deployments that should no longer be reachable:
# everything on a branch that is gone, and the commit builds a branch alias
# has moved off. See scripts/prune-deployments.mjs.
#
# Needs the two CLOUDFLARE_* repository secrets; without them the job says so
# and exits clean. Manual only until the `delete` and `schedule` triggers
# below are uncommented: docs/pruner.md.
name: Prune deployments

# What a run did, in its title: the Actions list is otherwise a column of
# identical rows, and which of them deleted something is the one thing worth
# seeing from there.
run-name: >-
  Prune deployments${{ inputs.dry_run == true && ' (dry run)' || '' }}${{
  inputs.deployment && format(' — {0}', inputs.deployment) || '' }}${{
  inputs.branch_rev && format(' — {0}', inputs.branch_rev) || '' }}${{
  inputs.commit_rev && format(' — {0}', inputs.commit_rev) || '' }}

on:
  # Off until turned on deliberately. The schedule is the net under the
  # delete event, and what clears commit builds on branches nobody deleted.
  # delete:
  # schedule:
  #   - cron: '17 14 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List only, delete nothing'
        required: false
        type: boolean
        default: false
      deployment:
        description: 'Cloudflare id or address'
        required: false
        default: ''
      branch_rev:
        description: 'Git branch'
        required: false
        default: ''
      commit_rev:
        description: 'Commit sha'
        required: false
        default: ''

# The one credential this needs is a Cloudflare token, not a GitHub one.
permissions:
  contents: read

# Queue rather than cancel: a canceled prune is a prune that did not happen.
concurrency:
  group: prune-deployments
  cancel-in-progress: false

jobs:
  prune:
    name: 🧹 Prune deployments
    # A fork must not inherit a schedule that deletes from this account's
    # Pages project. `delete` also fires for tags, which never deploy.
    if: |
      github.repository == '{{SITE_REPO}}' &&
      (github.event_name != 'delete' || github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No `bun install`: the script imports nothing but node builtins.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Prune
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Via env rather than inlined into the script: these are
          # typed by hand into a dispatch form.
          DEPLOYMENT: ${{ inputs.deployment }}
          BRANCH_REV: ${{ inputs.branch_rev }}
          COMMIT_REV: ${{ inputs.commit_rev }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Actions renders ANSI, but the script's stdout here is a pipe, so
          # it would color nothing without being told.
          FORCE_COLOR: '1'
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::warning title=Not configured::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN to turn this on.'
            echo '## Prune deployments' >> "$GITHUB_STEP_SUMMARY"
            echo 'Nothing ran: the two `CLOUDFLARE_*` repository secrets are not set.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The script prints and stops without --delete, so a scheduled run
          # that forgot it would delete nothing, forever. Withholding it is
          # dispatch-only: `delete` and `schedule` leave the input empty.
          #
          # An `if` rather than `[ ... ] && DELETE=`, which under `set -e`
          # exits on the ordinary false case.
          DELETE=--delete
          MODE='Deleting.'
          if [ "$DRY_RUN" = 'true' ]; then
            DELETE=
            MODE='Dry run: listing only, nothing was deleted.'
          fi

          {
            echo '## Prune deployments'
            echo "$MODE"
          } >> "$GITHUB_STEP_SUMMARY"

          # Each invocation: its own collapsible section in the log, its own
          # heading and table in the job summary — the script appends that
          # itself, from the fields, rather than the workflow parsing them back
          # out of the text — and its headline as an annotation at the top of
          # the run. Escapes are stripped from the annotation, which is not a
          # terminal.
          prune() {
            local heading=$1; shift
            local out status=0

            echo "::group::$heading"
            printf '### %s\n\n' "$heading" >> "$GITHUB_STEP_SUMMARY"
            out=$(bun scripts/prune-deployments.mjs "$@" $DELETE) || status=$?
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "$out"
            echo '::endgroup::'

            echo "::notice title=${heading}::$(echo "$out" | head -1 | sed -E 's/\x1b\[[0-9;]*m//g')"
            return $status
          }

          # Both sweeps named rather than left to the script's default, which
          # could change under a workflow that did not ask for it.
          prune 'Sweeps' --branches --commits

          # The sweeps cannot reach anything on a branch that still exists.
          # These are how you reach one, by any name it has.
          if [ -n "$DEPLOYMENT" ]; then
            prune "Deployment $DEPLOYMENT" --deployment "$DEPLOYMENT"
          fi

          if [ -n "$BRANCH_REV" ]; then
            prune "Branch $BRANCH_REV" --branch-rev "$BRANCH_REV"
          fi

          if [ -n "$COMMIT_REV" ]; then
            prune "Commit $COMMIT_REV" --commit-rev "$COMMIT_REV"
          fi
