<!doctype html>
<!--
  Served for any path that doesn't match an asset. Without this file
  Cloudflare Pages treats the output as a SPA and serves index.html with a
  200 for every unmatched path.
-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, notranslate, noimageindex">
<meta name="tdm-reservation" content="1">
<title>Not found</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         max-width: 20rem; margin: 20vh auto; padding: 0 1.5rem; line-height: 1.5; }
  h1 { font-size: 0.9rem; font-weight: 600; }
  p { color: #888; font-size: 0.9rem; }
</style></head><body>
<h1>Not found</h1>
<p>No such page. <a href="/">Back to start</a>.</p>
</body></html>
